name: Validate

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Set up Python 3.14
        uses: actions/setup-python@751276eafca55f10f252026015f43c488f2322ba
        with:
          python-version: "3.14"
          cache: pip
      - name: Install exact Home Assistant test environment
        run: >-
          python -m pip install
          homeassistant==2026.5.2
          pytest-homeassistant-custom-component==0.13.331
          ruff==0.16.4
      - name: Run static checks
        run: ruff check . && ruff format --check .
      - name: Run tests
        run: pytest -q

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb

  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Validate HACS repository
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
